// LeekScript-only build: the optional Linux Graal isolate is not needed.
// Keep upstream sources untouched and exclude just its absent binary dependency.
allprojects {
    tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    afterEvaluate {
        configurations.findByName('implementation')?.dependencies?.removeAll { dep ->
            dep instanceof org.gradle.api.artifacts.FileCollectionDependency &&
            dep.files.files.any { it.name == 'js-isolate-resources-linux-amd64.jar' }
        }
    }
}

// Arena extension: keep upstream checkout pristine, compile a reproducible overlay.
// Longer matches need complete turn events and draw finalization at the requested cap.
gradle.projectsEvaluated {
    def project = rootProject
    def arenaSources = project.layout.buildDirectory.dir('arena-sources')
    def prepare = project.tasks.register('prepareArenaSources', Sync) {
        from project.file('src/main/java')
        into arenaSources
        filter { String line ->
            line.replace('public final static int MAX_TURNS = 64;', 'public final static int MAX_TURNS = 1000;')
                .replace('state.getOrder().getTurn() == Fight.MAX_TURNS + 1', 'state.getOrder().getTurn() == max_turns + 1')
        }
    }
    project.sourceSets.main.java.setSrcDirs([arenaSources])
    project.tasks.named('compileJava').configure { dependsOn prepare }
}
