[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-leek-arena"
version = "0.1.0"
description = "Reproducible local LeekScript tournaments for LLM-generated strategies"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools]
packages = ["arena", "arena_web"]

[tool.setuptools.package-data]
arena = ["compiler_errors.json"]
arena_web = ["static/*"]

