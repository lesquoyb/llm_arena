<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Arena</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/workspace.css" />
    <script src="/live-dom.js" defer></script>
    <script src="/repetition-stats.js" defer></script>
    <script src="/repetition-chart.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside class="sidebar">
      <a class="brand" href="#view=dashboard"
        ><img src="/favicon.png" alt="" width="36" height="36" /><span
          >LLM ARENA</span
        ></a
      >
      <label class="workspace-picker" for="workspace-picker">Workspace<select id="workspace-picker" aria-label="Workspace"><option value="">All competitions</option></select></label>
      <nav aria-label="Main navigation">
        <a href="#view=workspaces" data-nav="workspaces"><span aria-hidden="true">▦</span> Workspaces</a>
        <a href="#view=dashboard" data-nav="dashboard"
          ><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg></span> Overview</a
        >
        <a href="#view=participants" data-nav="participants"
          ><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v3"/></svg></span> Participants</a
        >
        <a href="#view=competitions" data-nav="competitions"
          ><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3h8v5a4 4 0 0 1-8 0V3ZM8 5H4v2a5 5 0 0 0 5 5M16 5h4v2a5 5 0 0 1-5 5M12 12v6M7 21h10M9 18h6v3H9z"/></svg></span> Competitions <i id="active-count"></i
        ></a>
        <a href="#view=compare" data-nav="compare"
          ><span
            ><svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M3 18 10 11 14 15 21 6M15 6h6v6" /></svg
          ></span>
          Compare results</a
        >
      </nav>
      <div class="sidebar-note"><span class="pulse"></span> Local server</div>
      <a class="help-link" href="#view=help">Help & documentation</a>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span id="breadcrumb">Overview</span>
        <div>
          <span id="engine-status" class="badge">Connecting...</span
          ><button
            class="icon-button"
            data-action="refresh"
            title="Refresh"
            aria-label="Refresh"
          >
            ↻
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="empty">Loading...</div>
      </main>
      <footer>
        LLM Arena <span>LeekScript 4 · official Leek Wars engine</span>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
