<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt version history · LLM Arena</title><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/calibration.css"></head><body>
<header><a href="/">LLM Arena</a><span>Prompt version history</span></header><main>
<section><a id="back" href="/">Back to calibration</a><h1 id="title">Prompt version history</h1><p>Inspect every version, including rejected and untested proposals. Your choice does not change the recorded algorithm winner.</p><div class="fields"><label>Version<select id="version"></select></label><label>Compare against<select id="base"></select></label><label>File<select id="file"><option value="system prompt">System prompt</option></select></label></div><p id="status"></p><div class="actions"><button id="reuse">Use this version in a new study</button><button id="download" class="secondary">Download learning material</button><button id="prefer" class="secondary">Mark as my preferred version</button></div><small id="preference"></small></section>
<section><h2>Versions</h2><div id="versions"></div></section>
<section><h2>Changes</h2><p id="rationale"></p><pre id="diff" class="record-code"></pre><details><summary>Before and after</summary><div class="fields"><label>Before<textarea id="before" rows="16" readonly></textarea></label><label>After<textarea id="after" rows="16" readonly></textarea></label></div></details></section><p id="error" role="alert" hidden></p>
</main><script src="/calibration-history.js"></script></body></html>
